# LabPilot AI 部署配置（Render 单服务镜像）
#
# 用法：Render 控制台 → New → Blueprint → 选择仓库 5655-hu/labpilot-ai
#      Render 读取本文件，用仓库根的 Dockerfile 构建一个镜像：
#      前端构建产物打进镜像，同一个 uvicorn 进程同时提供页面与 /api。
#      不需要再单独发布前端，也不需要配 CORS。
#
# 免费层限制（是平台规则，不是配置错误）：
#   1. 15 分钟无请求会休眠，下次访问冷启动 30~60 秒。
#   2. 没有持久磁盘，容器重启后文件系统重置。
#      服务启动时会自动 seed 3 份黄金演示数据（app/main.py 的 lifespan），
#      所以评委演示不受影响；但用户自己上传的数据集会在重启后丢失。
#   3. 要真正持久，二选一：
#      a) 填 DATABASE_URL=libsql://... 与 TURSO_AUTH_TOKEN（Turso 云 SQLite，
#         步骤见 backend/docs/turso_setup.md）
#      b) 升级付费层并挂 Disk，DATABASE_URL=sqlite:///data/labpilot.db
#
# 不要在仓库里写任何真实密钥：sync: false 的变量到 Render 控制台手填。

services:
  - type: web
    name: labpilot-ai
    runtime: docker
    plan: free
    # 新加坡离国内近；若提示该区不支持免费层，换成 oregon
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # 镜像内已设默认值，这里显式声明便于排查
      - key: FRONTEND_DIR
        value: /app/static
      # 端口由 Render 注入 PORT 环境变量，Dockerfile 的 CMD 会读取，勿写死
      - key: TRUST_PROXY
        value: "1"          # Render 在反代后面，取 X-Forwarded-For 才能按真实访客 IP 限流
    # 应急开关：被刷时在控制台加 DEMO_READ_ONLY=1，冻结上传/删除（分析仍可跑）
    # - key: DEMO_READ_ONLY
    #   value: "1"
